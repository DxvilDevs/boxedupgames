<style>
:root{--kraft:#c99a5b;--kraft-dark:#a97c40;--crate-shadow:#5b3d1d;--ink:#241708;--ink-soft:#4a3319;--cream:#fbf0d9;--yellow:#ffd23f;--yellow-deep:#f2a900;--tape:#e9dcb8;--stamp-red:#c1462f;--line:rgba(36,23,8,.16)}
*{box-sizing:border-box} html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(rgba(255,255,255,.035),rgba(0,0,0,.035)),repeating-linear-gradient(0deg,transparent 0 34px,rgba(36,23,8,.025) 35px 36px),var(--kraft)}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0}
body:before{inset:18px;border:2px dashed rgba(36,23,8,.25);border-radius:18px}
body:after{width:150vw;height:72px;left:-25vw;top:9%;background:rgba(233,220,184,.78);border-top:2px solid rgba(36,23,8,.15);border-bottom:2px solid rgba(36,23,8,.15);transform:rotate(-2.5deg);box-shadow:0 3px 0 rgba(91,61,29,.12)}
.wrap{position:relative;z-index:1;width:min(940px,calc(100% - 38px));padding:52px 0}
.crate{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 34%),linear-gradient(180deg,#d3a365,#c49150);border:3px solid var(--ink);border-radius:16px;box-shadow:11px 12px 0 var(--crate-shadow);padding:clamp(30px,6vw,68px);text-align:center;overflow:hidden}
.crate:before{content:"";position:absolute;inset:11px;border:2px dashed rgba(36,23,8,.26);border-radius:10px;pointer-events:none}
.logo{width:92px;height:92px;object-fit:contain;filter:drop-shadow(4px 5px 0 rgba(36,23,8,.25));position:relative;z-index:2}
.code{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-size:clamp(100px,24vw,230px);line-height:.78;margin:24px 0 10px;letter-spacing:-.08em;text-shadow:6px 7px 0 rgba(91,61,29,.25)}
.stamp{display:inline-block;margin:-8px 0 22px;padding:8px 16px;border:4px solid var(--stamp-red);color:var(--stamp-red);font:900 clamp(18px,4vw,30px)/1 ui-monospace,'Courier New',monospace;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(193,70,47,.18)}
h1{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;text-transform:uppercase;font-size:clamp(27px,5vw,46px);margin:0 0 12px}
p{max-width:590px;margin:0 auto 27px;color:var(--ink-soft);font-size:clamp(15px,2vw,18px);line-height:1.55;font-weight:650}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;text-transform:uppercase;font:900 13px/1 ui-monospace,'Courier New',monospace;letter-spacing:.06em;border:2px solid var(--ink);border-radius:9px;padding:14px 18px;box-shadow:4px 4px 0 var(--crate-shadow);transition:.12s transform,.12s box-shadow}
a.primary{background:var(--yellow);color:var(--ink)}a.secondary{background:var(--cream);color:var(--ink)}a:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--crate-shadow)}
.label{position:absolute;right:clamp(-36px,-2vw,-12px);top:40px;background:var(--cream);border:2px solid var(--ink);padding:8px 48px;font:800 11px/1 ui-monospace,'Courier New',monospace;text-transform:uppercase;transform:rotate(7deg);box-shadow:3px 3px 0 var(--crate-shadow)}
.footer{text-align:center;margin-top:28px;font:800 11px/1.4 ui-monospace,'Courier New',monospace;text-transform:uppercase;letter-spacing:.08em;color:rgba(36,23,8,.7)}
@media(max-width:560px){body:before{inset:9px}.crate{box-shadow:7px 8px 0 var(--crate-shadow)}.label{display:none}.code{margin-top:20px}a{width:100%;justify-content:center}}
</style>
